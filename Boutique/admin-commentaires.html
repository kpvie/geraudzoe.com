<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modération des commentaires</title>
<meta name="robots" content="noindex, nofollow">
<!--
  ============================================================
  PAGE PRIVÉE — à ne lier depuis AUCUN menu ni page publique.
  Toute personne connaissant l'URL peut voir le formulaire,
  mais sans la clé secrète (ADMIN_KEY), rien ne fonctionne :
  le worker refuse toute action de modération.
  ============================================================
-->
<style>
  body { font-family: "Inter", sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #10131a; }
  h1 { font-family: "Sora", sans-serif; }
  #zoneCle { display: flex; gap: 10px; margin-bottom: 30px; }
  #zoneCle input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
  #zoneCle button { padding: 10px 18px; border: none; background: #2e5cff; color: #fff; border-radius: 8px; cursor: pointer; }
  .item { background: #f7f8fa; border: 1px solid rgba(16,19,26,0.09); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .meta { font-size: 0.82rem; color: #6b7280; margin-bottom: 8px; }
  .texte { margin-bottom: 12px; white-space: pre-wrap; }
  .actions button { margin-right: 8px; padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .approuver { background: #15803d; color: #fff; }
  .rejeter { background: #b91c1c; color: #fff; }
  .supprimer { background: #6b7280; color: #fff; }
  #filtre { margin-bottom: 20px; }
</style>
</head>
<body>

  <h1>Modération des commentaires</h1>

  <div id="zoneCle">
    <input type="password" id="champCle" placeholder="Colle ta clé d'administration">
    <button id="boutonValider">Valider</button>
  </div>

  <div id="zoneContenu" style="display:none;">
    <div id="filtre">
      <label>Afficher :
        <select id="selectStatut">
          <option value="en_attente">En attente</option>
          <option value="approuve">Approuvés</option>
          <option value="rejete">Rejetés</option>
        </select>
      </label>
    </div>
    <div id="listeCommentaires"></div>
  </div>

  <script>
    //Je dois manger du riz pour avoir de l'énergie et pouvoir coder. sinon, c'est gaté !
    
    const URL_API = "https://commentaires-api.kpoviessigeraude.workers.dev";

    let cleAdmin = sessionStorage.getItem("gz_cle_admin") || "";

    const champCle = document.getElementById("champCle");
    const zoneContenu = document.getElementById("zoneContenu");
    const selectStatut = document.getElementById("selectStatut");
    const listeCommentaires = document.getElementById("listeCommentaires");

    if (cleAdmin) {
      champCle.value = cleAdmin;
      zoneContenu.style.display = "block";
      chargerListe();
    }

    document.getElementById("boutonValider").addEventListener("click", () => {
      cleAdmin = champCle.value.trim();
      sessionStorage.setItem("gz_cle_admin", cleAdmin);
      zoneContenu.style.display = "block";
      chargerListe();
    });

    selectStatut.addEventListener("change", chargerListe);

    async function appelAdmin(chemin, options = {}) {
      const reponse = await fetch(`${URL_API}${chemin}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Cle-Admin": cleAdmin,
          ...(options.headers || {}),
        },
      });
      if (reponse.status === 401) {
        alert("Clé d'administration incorrecte.");
        sessionStorage.removeItem("gz_cle_admin");
        throw new Error("Non autorisé");
      }
      return reponse.json();
    }

    async function chargerListe() {
      listeCommentaires.textContent = "Chargement...";
      try {
        const donnees = await appelAdmin(`/admin/commentaires?statut=${selectStatut.value}`);
        afficherListe(donnees.commentaires || []);
      } catch {
        listeCommentaires.textContent = "Erreur de chargement.";
      }
    }

    function afficherListe(commentaires) {
      listeCommentaires.innerHTML = "";
      if (commentaires.length === 0) {
        listeCommentaires.textContent = "Aucun commentaire dans cette catégorie.";
        return;
      }

      commentaires.forEach((item) => {
        const bloc = document.createElement("div");
        bloc.className = "item";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `#${item.id} — page: ${item.page_id} — `;
        const auteur = document.createElement("strong");
        auteur.textContent = item.nom;
        meta.appendChild(auteur);

        const texte = document.createElement("div");
        texte.className = "texte";
        texte.textContent = item.texte;

        const actions = document.createElement("div");
        actions.className = "actions";

        if (item.statut !== "approuve") {
          const btnApprouver = document.createElement("button");
          btnApprouver.className = "approuver";
          btnApprouver.textContent = "Approuver";
          btnApprouver.onclick = () => changerStatut(item.id, "approuve");
          actions.appendChild(btnApprouver);
        }
        if (item.statut !== "rejete") {
          const btnRejeter = document.createElement("button");
          btnRejeter.className = "rejeter";
          btnRejeter.textContent = "Rejeter";
          btnRejeter.onclick = () => changerStatut(item.id, "rejete");
          actions.appendChild(btnRejeter);
        }
        const btnSupprimer = document.createElement("button");
        btnSupprimer.className = "supprimer";
        btnSupprimer.textContent = "Supprimer définitivement";
        btnSupprimer.onclick = () => supprimer(item.id);
        actions.appendChild(btnSupprimer);

        bloc.appendChild(meta);
        bloc.appendChild(texte);
        bloc.appendChild(actions);
        listeCommentaires.appendChild(bloc);
      });
    }

    async function changerStatut(id, statut) {
      await appelAdmin(`/admin/commentaires/${id}`, {
        method: "PATCH",
        body: JSON.stringify({ statut }),
      });
      chargerListe();
    }

    async function supprimer(id) {
      if (!confirm("Supprimer définitivement ce commentaire ?")) return;
      await appelAdmin(`/admin/commentaires/${id}`, { method: "DELETE" });
      chargerListe();
    }
  </script>

</body>
</html>
